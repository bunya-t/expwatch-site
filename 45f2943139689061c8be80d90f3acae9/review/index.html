<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>承認コンソール</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --surface-2:#EDF1EC; --surface-3:#E3E9E3;
  --ink:#161A18; --muted:#5D6A62; --line:#D9E0DA;
  --accent:#1F6F4A; --accent-soft:#E4F0E8;
  --ok:#1F6F4A; --ok-soft:#DFEDE5; --no:#A6392A; --no-soft:#F7E4E0;
  --hold:#8A6516; --hold-soft:#F6EBD5;
  --shadow:0 1px 2px rgba(20,32,26,.07); --shadow-lg:0 12px 32px rgba(20,32,26,.16);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1211; --surface:#161B19; --surface-2:#1D2321; --surface-3:#242C29;
    --ink:#E7EDE8; --muted:#9AA8A0; --line:#293230;
    --accent:#57C68D; --accent-soft:#16301F;
    --ok:#57C68D; --ok-soft:#16301F; --no:#E2836F; --no-soft:#331A15;
    --hold:#D9B265; --hold-soft:#2E2412;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 14px 36px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1211; --surface:#161B19; --surface-2:#1D2321; --surface-3:#242C29;
  --ink:#E7EDE8; --muted:#9AA8A0; --line:#293230;
  --accent:#57C68D; --accent-soft:#16301F;
  --ok:#57C68D; --ok-soft:#16301F; --no:#E2836F; --no-soft:#331A15;
  --hold:#D9B265; --hold-soft:#2E2412;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 14px 36px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;
  border:3px solid transparent;background-clip:content-box}

/* ---------- 骨格 ---------- */
.app{display:grid;height:100vh;
  grid-template-columns:236px 356px 1fr; grid-template-rows:auto 1fr;
  grid-template-areas:"top top top" "side list detail"}
.top{grid-area:top;z-index:20;background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:9px 16px}
.side{grid-area:side;overflow-y:auto;border-right:1px solid var(--line);
  background:var(--surface-2);padding:12px 12px 40px}
.listwrap{grid-area:list;overflow-y:auto;border-right:1px solid var(--line);
  background:var(--surface);overscroll-behavior:contain}
.detail{grid-area:detail;overflow-y:auto;background:var(--bg);position:relative}

/* ---------- 上部バー ---------- */
.brand{font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.08em;
  font-weight:400;line-height:1.2}
.search{flex:1 1 200px;min-width:150px;max-width:420px;position:relative}
.search input{width:100%;padding:7px 12px 7px 32px;border-radius:999px;
  border:1px solid var(--line);background:var(--bg);font-size:13px}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none}
.prog{display:flex;align-items:center;gap:14px;margin-left:auto}
.stat{display:flex;flex-direction:column;line-height:1.15;text-align:right}
.stat b{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:19px;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:10px;letter-spacing:.09em;color:var(--muted)}
.stat.kgi b{color:var(--ok)}
.bar{width:130px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;
  transition:width .35s cubic-bezier(.2,.8,.2,1)}
.tools{display:flex;gap:6px}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--surface-2);color:var(--ink)}
.tbtn:active{transform:scale(.97)}
.tbtn[disabled]{opacity:.4;cursor:default}
.tbtn.pri{border-color:var(--accent);color:var(--accent)}
.tbtn input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#drawer{display:none}

/* ---------- 絞り込み ---------- */
.fgroup{margin-bottom:16px}
.fgroup h3{font-size:10.5px;letter-spacing:.12em;color:var(--muted);
  margin-bottom:7px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:3px 10px;font-size:11.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;line-height:1.6}
.chip:hover{border-color:var(--muted)}
.chip:active{transform:scale(.97)}
.chip .n{font-size:10px;opacity:.7;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
  color:var(--accent);font-weight:500}
.chip.v-approved[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.v-pending[aria-pressed="true"]{background:var(--hold-soft);border-color:var(--hold);color:var(--hold)}
.chip.v-rejected[aria-pressed="true"]{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.colist{max-height:210px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);padding:4px}
.colist label{display:flex;gap:7px;align-items:center;padding:3px 6px;border-radius:5px;
  font-size:12px;cursor:pointer}
.colist label:hover{background:var(--surface-2)}
.colist input{accent-color:var(--accent);margin:0}
.colist .n{margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cofind{width:100%;padding:5px 9px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface);font-size:12px;margin-bottom:6px}
.freset{width:100%;margin-top:4px}

/* ---------- リスト ---------- */
.listhead{position:sticky;top:0;z-index:5;padding:8px 14px;font-size:11px;
  letter-spacing:.08em;color:var(--muted);
  background:color-mix(in srgb,var(--surface) 84%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  display:flex;gap:8px;align-items:center}
.listhead select{margin-left:auto;font-size:11px;border:1px solid var(--line);
  background:var(--surface);border-radius:6px;padding:2px 5px}
.row{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;
  padding:9px 14px 9px 11px;background:none;border:0;border-bottom:1px solid var(--line);
  cursor:pointer;border-left:3px solid transparent}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.row.v-approved{border-left-color:var(--ok)}
.row.v-pending{border-left-color:var(--hold)}
.row.v-rejected{border-left-color:var(--no)}
.row.v-rejected .r-co{text-decoration:line-through;text-decoration-thickness:1px}
.r-main{flex:1 1 auto;min-width:0}
.r-co{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block}
.r-meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block;line-height:1.5}
.r-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.r-tags{display:flex;gap:3px}
.vp{font-size:9.5px;letter-spacing:.06em;padding:0 4px;border-radius:3px;
  background:var(--surface-3);color:var(--muted);line-height:1.55}
.rank{display:inline-flex;gap:1.5px;align-items:flex-end;height:9px}
.rank i{width:3px;background:var(--muted);opacity:.28;border-radius:1px}
.rank i:nth-child(1){height:4px} .rank i:nth-child(2){height:6.5px} .rank i:nth-child(3){height:9px}
.rank i.on{opacity:.85}
.mark{font-size:11px;line-height:1.4;font-weight:700}
.mark.v-approved{color:var(--ok)} .mark.v-pending{color:var(--hold)} .mark.v-rejected{color:var(--no)}
.empty{padding:40px 20px;color:var(--muted);font-size:12.5px;text-align:center}

/* ---------- 詳細 ---------- */
.d-empty{display:flex;flex-direction:column;justify-content:center;align-items:center;
  height:100%;gap:14px;color:var(--muted);padding:40px;text-align:center}
.d-empty kbd{margin:0 1px}
.d-head{position:sticky;top:0;z-index:10;padding:14px 22px 11px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);
  backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line)}
.d-title{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.d-title h2{font-size:18px;letter-spacing:.01em}
.d-title .id{font-size:11.5px;color:var(--muted)}
.d-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.b{font-size:11px;letter-spacing:.03em;padding:1px 8px;border-radius:4px;
  background:var(--surface-2);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.b.kind{background:var(--surface-3);color:var(--ink)}
.b.tool{background:var(--accent-soft);color:var(--accent)}
.b.cal{background:var(--hold-soft);color:var(--hold)}
.d-url{display:block;margin-top:7px;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-url:hover{color:var(--accent)}
.judgebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:11px}
.judge{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:var(--surface)}
.judge button{padding:6px 16px;border:0;border-right:1px solid var(--line);
  background:none;color:var(--muted);cursor:pointer;font-size:13px;
  transition:background .12s ease-out}
.judge button:last-child{border-right:0}
.judge button:hover{background:var(--surface-2)}
.judge button:active{transform:scale(.98)}
.judge button kbd{margin-left:6px}
.judge button.ok[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);font-weight:700}
.judge button.hold[aria-pressed="true"]{background:var(--hold-soft);color:var(--hold);font-weight:700}
.judge button.no[aria-pressed="true"]{background:var(--no-soft);color:var(--no);font-weight:700}
kbd{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;
  border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;
  background:var(--surface-2);color:var(--muted)}
.notewrap{flex:1 1 240px;display:flex;gap:8px;align-items:center;min-width:200px}
.notewrap input{flex:1 1 auto;padding:6px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);font-size:12.5px}
.notewrap input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.saved{font-size:10.5px;color:var(--muted);flex:0 0 auto;min-width:4.6em;text-align:right}

.d-body{padding:18px 22px 90px;max-width:1180px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.fact{font-size:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:3px 10px;color:var(--muted)}
.fact.warn{background:var(--hold-soft);border-color:transparent;color:var(--hold)}
.vtabs{display:flex;gap:4px;margin-bottom:12px}
.vtab{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:8px;padding:4px 14px;font-size:12.5px;cursor:pointer}
.vtab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.shots{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  margin-bottom:18px}
.shots.wide{grid-template-columns:1fr}
.shots[hidden]{display:none}
figure{margin:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
figcaption{font-size:11.5px;color:var(--muted);padding:8px 12px;
  border-bottom:1px solid var(--line);line-height:1.5}
figcaption b{color:var(--ink)}
figure img{width:100%;height:auto;display:block;cursor:zoom-in;background:var(--surface-2)}
.sec{margin:22px 0 0}
.sec>h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:9px;font-weight:500}
.arms{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.arm{border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:var(--surface)}
.arm-h{display:flex;gap:8px;align-items:baseline;margin-bottom:5px}
.arm-h b{font-size:17px;font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",ui-monospace,monospace}
.arm-h span{font-size:12.5px}
.arm ul{margin:0;padding-left:17px;font-size:12.5px;line-height:1.65}
.arm ul.sel{margin-top:6px;color:var(--muted);font-size:10.5px;line-height:1.5;
  word-break:break-all}
details.full{margin-top:20px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);overflow:hidden}
details.full summary{padding:9px 14px;font-size:12.5px;color:var(--muted);cursor:pointer}
details.full summary:hover{color:var(--accent)}
details.full .shots{padding:0 12px 12px;margin:0}
.kdesc{margin-top:24px;padding:13px 15px;border-radius:var(--r);
  background:var(--surface-2);color:var(--muted);font-size:12px;line-height:1.75;max-width:78ch}
.kdesc b{color:var(--ink);font-weight:500}
.nojudge{padding:16px;border:1px dashed var(--line);border-radius:var(--r);
  color:var(--muted);font-size:12.5px;background:var(--surface)}

/* ---------- 拡大・トースト ---------- */
#zoom{position:fixed;inset:0;background:rgba(8,12,10,.93);z-index:80;display:none;
  align-items:flex-start;justify-content:center;overflow:auto;padding:20px;cursor:zoom-out}
#zoom.on{display:flex}
#zoom img{max-width:100%;height:auto;border-radius:6px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:90;
  background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
  transition:opacity .18s ease-out, transform .28s cubic-bezier(.2,.8,.2,1)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .dot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:7px;
  vertical-align:middle}
.back{display:none}

/* ---------- 狭い画面 ---------- */
@media (max-width:1180px){
  .app{grid-template-columns:340px 1fr;grid-template-areas:"top top" "list detail"}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;
    box-shadow:var(--shadow-lg);transform:translateX(-102%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);border-right:1px solid var(--line)}
  body.drawer .side{transform:translateX(0)}
  #drawer{display:inline-flex}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-areas:"top" "list"}
  .detail{position:fixed;inset:0;top:0;z-index:50;background:var(--bg);display:none}
  body.open .detail{display:block}
  .back{display:inline-flex}
  .prog .stat:not(.kgi),.bar{display:none}
  .brand small{display:none}
  .d-body{padding:16px 14px 90px}
  .d-head{padding:12px 14px 10px}
}
@media (max-width:620px){
  .top{flex-wrap:wrap;padding:8px 12px}
  .search{order:9;flex:1 1 100%;max-width:none}
  .brand{font-size:14px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="tbtn" id="drawer" title="絞り込み">絞り込み</button>
    <div class="brand">承認コンソール<small>検知した実験候補を目視で判定する</small></div>
    <div class="search"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" width="14"
        height="14" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7"
        r="4.6"/><path d="M10.4 10.4 14 14" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="会社・URL・メモで探す（/）" aria-label="検索"></div>
    <div class="prog">
      <div class="stat kgi"><b id="kgi">0</b><span>承認（KGI）</span></div>
      <div class="stat"><b><span id="done">0</span><span style="font-size:12px;color:var(--muted)">/<span id="total">0</span></span></b><span>判定済み</span></div>
      <div class="stat"><b id="cal">0</b><span>較正用</span></div>
      <div class="bar" title="判定の進み"><i id="progbar" style="width:0"></i></div>
    </div>
    <div class="tools">
      <button class="tbtn pri" id="export" disabled>判定を書き出す</button>
      <label class="tbtn" for="import">取り込む<input id="import" type="file"
        accept="application/json,.json"></label>
      <button class="tbtn" id="clear" title="この端末の判定を消す">消す</button>
    </div>
  </header>
  <aside class="side" id="side"></aside>
  <div class="listwrap">
    <div class="listhead"><span id="count">0 件</span>
      <select id="sort" aria-label="並び順">
        <option value="kind">証拠の強い順</option>
        <option value="company">会社名順</option>
        <option value="state">未判定を先頭</option>
      </select></div>
    <div id="list"></div>
  </div>
  <main class="detail" id="detail"></main>
</div>

<script type="application/json" id="kinds">[{"k":"split","label":"SPLIT_URL（タグに両URL定義）","short":"SPLIT_URL","rank":3,"desc":"VWO のタグが control と variant の両URLを申告している実験。両方を同じ条件で取得して並べた。赤枠は当方が自動検出した差分。"},{"k":"forced","label":"強制取得（全バリアントを決定論的に取得）","short":"強制取得","rank":3,"desc":"タグに両URLが無い書き換え型の実験。一般の訪問者が受け取るのと同じ割当Cookieを入れて各バリアントを取得したもの。ツールのSDKがその値を採用したことまで確認している。"},{"k":"karte","label":"KARTE 接客の配信差","short":"KARTE 接客差","rank":2,"desc":"同一プロファイル・同時刻のアクセスで、KARTE が注入する接客の識別子が食い違ったもの。KARTE は実験IDを公開しないため、この識別子が唯一の手がかりになる。"},{"k":"layer1","label":"SDK が割当差を申告","short":"SDK 割当差","rank":2,"desc":"タグの SDK が、同じ条件の訪問に異なる variation を割り当てたと申告している実験。"},{"k":"kaizen","label":"Kaizen 割当差（サーバ側割当）","short":"Kaizen 割当差","rank":2,"desc":"Kaizen はサーバ側でバケット判定し、この訪問に割り当てた1バリアントだけを返す。同条件の複数アクセスで別バリアントが返った＝乱数割当の直接証拠。配分と全アームはサーバ側にあり読めないので、そこは主張しない。"},{"k":"dlpo","label":"DLPO 配信差（サーバ側割当・エリア単位）","short":"DLPO 配信差","rank":2,"desc":"DLPO はエリア単位のサーバ側配信。タグは汎用ランタイムで、実際の配信は c_batch.js がエリアごとの内容で返す。同条件の複数アクセスで別内容（別パターン、または配信あり/なし）が返った＝割当の直接証拠。配分と全パターンはサーバ側にあり読めない。"},{"k":"site","label":"画面差のみ（サイト単位・目視で判定する）","short":"画面差のみ","rank":1,"desc":"同じ条件・同じ時刻のアクセスで表示が分かれたが、実験IDまでは辿れていないもの。片側が読み込み途中、自動送りのカルーセル、時刻表示のずれでも同じ見え方になるため、ここは目視でしか決められない。"},{"k":"karte_blocks","label":"KARTE Blocks（配分と両アームの中身がタグに書いてある）","short":"KARTE Blocks","rank":3,"desc":"KARTE Blocks の設定ファイルには、実験ごとにトラフィック配分（例 実施70%／未実施15%）と、各アームで実際に差し込むHTML・CSSがそのまま入っている。つまり「どこで・何を・何%ずつ出し分けているか」を推測せずに読める。赤枠は差分検出ではなく、Blocks 自身が差し替え対象として印を付けた領域そのもの。　画像の見方に注意: 「アーム1／アーム2」と書いてあるものは、タグに書かれた各アームを当方が対象ページに当てて撮ったもので、その訪問でそのアームが配信されたという意味ではない（VWO の強制取得と同じ扱い）。「この訪問で実際に配信された状態」と書いてあるものだけが受動観測。Blocks は適用率が低く、配信を待つ方式では見た目の差分がほとんど取れないためこの形にしている。"},{"k":"ptengine","label":"Ptengine（配信応答に配分と差し込み内容が平文）","short":"Ptengine","rank":3,"desc":"Ptengine の配信応答（stats.ptengine.jp/collect）に、実験ごとの版ごとの配分（rate）と各版が差し込むHTML・CSS・差し込み先セレクタ・対象URLが平文で入っている。つまり「どこで・何を・何%ずつ出し分けているか」を推測せずに読める。アーム画像は当方がタグの中身を対象ページに当てて撮ったもの（VWO の強制取得と同じ扱い）で、その訪問でそのアームが配信されたという意味ではない。"},{"k":"optimize_next","label":"Optimize Next（GTM コンテナ内に配分と変更内容が平文）","short":"Optimize Next","rank":3,"desc":"Google Optimize 後継のコンテナ型ツール。サイトの GTM コンテナ（gtm.js）内のテンプレートタグに、実験ID・バリアント名・配分（例 50/50）・対象URL条件・バリアントごとのDOM変更が平文で入っている。KARTE Blocks / VWO SPLIT_URL と同格の証拠源。アーム画像は当方がその変更を対象ページに当てて撮ったもので、その訪問でそのアームが配信されたという意味ではない。"},{"k":"vwo_visual","label":"VWO VISUAL_AB（lib 内に配分と各バリエーションの変更関数が平文）","short":"VWO 変更関数","rank":3,"desc":"VWO の lib（visualwebsiteoptimizer.com/lib/<acc>.js）に、実験ごとの配分・バリエーション名と、各バリエーションのDOM変更関数（jQuery 風）が平文で入っている。アーム画像は当方がその関数を対象ページで実行して撮ったもので、その訪問でそのアームが配信されたという意味ではない。"},{"k":"declared","label":"タグに宣言あり・割当差は未観測","short":"宣言のみ","rank":1,"desc":"タグの中に実験の定義は見えるが、こちらの観測では全アクセスが同じ側に入ったもの。実験の存在の証拠にはなるが、出し分けを見たわけではない。"}]</script>
<script type="application/json" id="tools">{"vwo":"VWO","karte":"KARTE","posthog":"PostHog","abtasty":"AB Tasty","optimizely":"Optimizely","convert":"Convert","growthbook":"GrowthBook","adobe_target":"Adobe Target","kameleoon":"Kameleoon","ptengine":"Ptengine","optimize_next":"Optimize Next","ab_tasty":"AB Tasty","karte_blocks":"KARTE Blocks","kaizen_platform":"Kaizen Platform","dlpo":"DLPO"}</script>
<script>
// 判定はこの端末（localStorage）に貯める。GitHub Pages にはサーバが無いので、
// 「判定を書き出す」で JSON を落とし、scripts/apply_reviews.py で台帳へ入れる。
// Artifact 上で開いたときだけ db にも同時保存する。形式は v1 から変えていない。
const KEY = "expwatch.reviews.v1";
const D = JSON.parse(document.getElementById("data").textContent);
const KINDS = JSON.parse(document.getElementById("kinds").textContent);
const KMAP = {}; KINDS.forEach(k => KMAP[k.k] = k);
const TOOLS = JSON.parse(document.getElementById("tools").textContent);
const VLABEL = {approved:"承認", pending:"保留", rejected:"却下"};
const VMARK = {approved:"承認", pending:"保留", rejected:"却下"};
const el = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let db = null;
const IDX = {}; D.forEach((c, i) => { c.i = i; IDX[c.id] = c; });

/* ---------- 保存 ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){ return {}; } }
function store(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); return true; }catch(e){ return false; } }
let SAVED = load();
const verdictOf = c => (SAVED[c.id] && SAVED[c.id].verdict !== undefined)
  ? (SAVED[c.id].verdict || "") : (c.vd || "");
const noteOf = c => (SAVED[c.id] && SAVED[c.id].note !== undefined)
  ? (SAVED[c.id].note || "") : (c.nt || "");

function persist(id){
  const c = IDX[id];
  const rec = {id:id, verdict: verdictOf(c), note: noteOf(c), at:new Date().toISOString()};
  const all = load();
  if(!rec.verdict && !rec.note) delete all[id]; else all[id] = rec;
  const ok = store(all);
  const s = el("saved"); if(s && CUR === id) s.textContent = ok ? "保存済み" : "保存できず";
  if(db) db.doc("reviews/" + id).set(rec).catch(e => console.error(e));
  return ok;
}
function applyRecords(recs){
  let n = 0;
  recs.forEach(r => {
    if(!r || !r.id || !IDX[r.id]) return;
    SAVED[r.id] = {id:r.id, verdict:r.verdict || "", note:r.note || "", at:r.at || ""};
    n++;
  });
  renderList(); if(CUR) renderDetail(CUR, true); paintStats();
  return n;
}

/* ---------- 絞り込みの状態（URL ハッシュに保存して共有・再開できる） ---------- */
const S = {q:"", kind:new Set(), tool:new Set(), vp:new Set(), st:new Set(),
           co:new Set(), jud:true, sort:"kind"};
let CUR = null;

function readHash(){
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  S.q = h.get("q") || "";
  ["kind","tool","vp","st","co"].forEach(k => {
    S[k] = new Set((h.get(k) || "").split(",").filter(Boolean).map(decodeURIComponent));
  });
  S.jud = h.get("j") !== "0";      // 既定は「画像で差あり・注意なし」だけ
  S.sort = h.get("s") || "kind";
  CUR = h.get("id") || null;
  if(CUR && !IDX[CUR]) CUR = null;
}
let hashLock = false;
function writeHash(){
  const h = new URLSearchParams();
  if(S.q) h.set("q", S.q);
  ["kind","tool","vp","st","co"].forEach(k => {
    if(S[k].size) h.set(k, [...S[k]].map(encodeURIComponent).join(","));
  });
  if(!S.jud) h.set("j", "0");
  if(S.sort !== "kind") h.set("s", S.sort);
  if(CUR) h.set("id", CUR);
  hashLock = true;
  history.replaceState(null, "", "#" + h.toString());
  setTimeout(() => hashLock = false, 0);
}

/* ---------- 絞り込みの適用 ---------- */
function matches(c){
  if(S.jud && c.tier !== "A") return false;
  if(S.kind.size && !S.kind.has(c.k)) return false;
  if(S.tool.size && !S.tool.has(c.tool || "-")) return false;
  if(S.co.size && !S.co.has(c.co)) return false;
  if(S.vp.size && !(c.vp || []).some(v => S.vp.has(v))) return false;
  if(S.st.size){
    const v = verdictOf(c) || "none";
    if(!S.st.has(v)) return false;
  }
  if(S.q){
    const q = S.q.toLowerCase();
    const hay = (c.co + " " + c.site + " " + c.id + " " + c.url + " " + c.tool + " "
                 + (c.nt_items || []).join(" ") + " " + noteOf(c)).toLowerCase();
    if(hay.indexOf(q) < 0) return false;
  }
  return true;
}
const KRANK = {};
KINDS.forEach((k, i) => KRANK[k.k] = i);
function view(){
  const rows = D.filter(matches);
  if(S.sort === "company") rows.sort((a, b) => a.co.localeCompare(b.co, "ja") || a.i - b.i);
  else if(S.sort === "state"){
    const o = {none:0, pending:1, approved:2, rejected:3};
    rows.sort((a, b) => (o[verdictOf(a) || "none"] - o[verdictOf(b) || "none"]) || a.i - b.i);
  } else rows.sort((a, b) => (KRANK[a.k] - KRANK[b.k]) || a.co.localeCompare(b.co, "ja") || a.i - b.i);
  return rows;
}
let VIEW = [];

/* ---------- 描画: 絞り込みパネル ---------- */
function tally(key, fn){
  const m = new Map();
  D.forEach(c => { const v = fn(c); (Array.isArray(v) ? v : [v]).forEach(x => {
    if(x === null || x === undefined || x === "") return;
    m.set(x, (m.get(x) || 0) + 1); }); });
  return m;
}
function chip(set, val, label, n, cls){
  return '<button class="chip ' + (cls || "") + '" data-set="' + set + '" data-val="'
    + esc(val) + '" aria-pressed="' + (S[set].has(val)) + '">' + esc(label)
    + (n === undefined ? "" : '<span class="n">' + n + "</span>") + "</button>";
}
function renderSide(){
  const kn = tally("kind", c => c.k), tn = tally("tool", c => c.tool || "-");
  const vn = tally("vp", c => c.vp || []);
  const st = {none:0, approved:0, pending:0, rejected:0};
  D.forEach(c => st[verdictOf(c) || "none"]++);
  const co = [...tally("co", c => c.co).entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ja"));

  let h = '<div class="fgroup"><h3>判定の状態</h3><div class="chips">'
    + chip("st", "none", "未判定", st.none)
    + chip("st", "approved", "承認", st.approved, "v-approved")
    + chip("st", "pending", "保留", st.pending, "v-pending")
    + chip("st", "rejected", "却下", st.rejected, "v-rejected")
    + '</div><div class="chips" style="margin-top:6px">'
    + '<button class="chip" id="fjud" aria-pressed="' + S.jud + '">画像で差あり・注意なし'
    + '<span class="n">' + D.filter(c => c.tier === "A").length + '</span></button></div></div>';

  h += '<div class="fgroup"><h3>証拠の種類</h3><div class="chips">'
    + KINDS.filter(k => kn.get(k.k)).map(k => chip("kind", k.k, k.short, kn.get(k.k))).join("")
    + "</div></div>";

  h += '<div class="fgroup"><h3>ツール</h3><div class="chips">'
    + [...tn.entries()].sort((a, b) => b[1] - a[1]).map(([t, n]) =>
        chip("tool", t, t === "-" ? "検出なし" : (TOOLS[t] || t), n)).join("")
    + "</div></div>";

  h += '<div class="fgroup"><h3>画面幅</h3><div class="chips">'
    + ["sp", "pc"].filter(v => vn.get(v)).map(v =>
        chip("vp", v, v === "sp" ? "SP" : "PC", vn.get(v))).join("")
    + "</div></div>";

  h += '<div class="fgroup"><h3>サイト・会社</h3>'
    + '<input class="cofind" id="cofind" type="search" placeholder="会社名で絞る" '
    + 'value="' + esc(window.__cofind || "") + '"><div class="colist" id="colist">'
    + co.map(([name, n]) =>
        '<label data-name="' + esc(name) + '"><input type="checkbox" data-set="co" data-val="'
        + esc(name) + '"' + (S.co.has(name) ? " checked" : "") + '><span>' + esc(name)
        + '</span><span class="n">' + n + "</span></label>").join("")
    + "</div>"
    + '<button class="tbtn freset" id="freset">絞り込みを解除</button></div>';

  el("side").innerHTML = h;
  filterCoList();
}
function filterCoList(){
  const q = (window.__cofind || "").toLowerCase();
  el("colist").querySelectorAll("label").forEach(l => {
    l.style.display = (!q || l.dataset.name.toLowerCase().indexOf(q) >= 0) ? "" : "none";
  });
}

/* ---------- 描画: リスト ---------- */
function rankBars(r){
  let s = '<span class="rank" title="証拠の強さ ' + r + '/3">';
  for(let i = 1; i <= 3; i++) s += '<i class="' + (i <= r ? "on" : "") + '"></i>';
  return s + "</span>";
}
function rowHTML(c){
  const v = verdictOf(c);
  const meta = [KMAP[c.k].short];
  const tl = c.tool ? (TOOLS[c.tool] || c.tool) : "";
  if(tl && tl !== KMAP[c.k].short) meta.push(tl);   // KARTE Blocks の二重表示を避ける
  if(c.prop) meta.push(c.prop.join("／") + "%");
  else if(c.boxes !== undefined) meta.push("差分枠 " + c.boxes);
  return '<button class="row ' + (v ? "v-" + v : "") + '" data-id="' + esc(c.id) + '"'
    + (CUR === c.id ? ' aria-current="true"' : "") + '>'
    + '<span class="r-main"><span class="r-co">' + esc(c.co) + "</span>"
    + '<span class="r-meta">' + esc(meta.join("・")) + "</span></span>"
    + '<span class="r-side">'
    + '<span class="r-tags">' + (c.vp || []).map(x =>
        '<span class="vp">' + x.toUpperCase() + "</span>").join("")
    + (c.ven ? '<span class="vp">較正</span>' : "") + "</span>"
    + (v ? '<span class="mark v-' + v + '">' + VMARK[v] + "</span>" : rankBars(KMAP[c.k].rank))
    + "</span></button>";
}
function renderList(){
  VIEW = view();
  el("count").textContent = VIEW.length + " 件";
  el("list").innerHTML = VIEW.length
    ? VIEW.map(rowHTML).join("")
    : '<p class="empty">条件に合う候補がありません。<br>左の「絞り込みを解除」で戻せます。</p>';
}
function paintStats(){
  let ok = 0, cal = 0, done = 0, mine = 0;
  const saved = load();
  D.forEach(c => {
    const v = verdictOf(c);
    if(v === "approved"){ if(c.ven) cal++; else ok++; }
    if(v) done++;
    if(saved[c.id]) mine++;
  });
  el("kgi").textContent = ok;
  el("done").textContent = done;
  el("total").textContent = D.length;
  el("cal").textContent = cal;
  el("progbar").style.width = Math.round(done / D.length * 100) + "%";
  el("export").disabled = mine === 0;
  el("export").textContent = mine ? "判定を書き出す（" + mine + "）" : "判定を書き出す";
}

/* ---------- 描画: 詳細 ---------- */
function shotFig(s){
  return "<figure><figcaption>" + esc(s.l || "証拠") + "</figcaption>"
    + '<img loading="lazy" decoding="async" width="' + s.w + '" height="' + s.h
    + '" src="' + esc(s.s) + '" alt="' + esc(s.l || "証拠画像") + '"></figure>';
}
function detailHTML(c){
  const v = verdictOf(c), K = KMAP[c.k];
  let h = '<div class="d-head">'
    + '<div class="d-title"><button class="tbtn back" id="back">← 一覧</button>'
    + "<h2>" + esc(c.co) + '</h2><span class="id mono">' + esc(c.id) + "</span></div>"
    + '<div class="d-badges"><span class="b kind">' + rankBars(K.rank) + " " + esc(K.short)
    + "</span>"
    + (c.tool && (TOOLS[c.tool] || c.tool) !== K.short
        ? '<span class="b tool">' + esc(TOOLS[c.tool] || c.tool) + "</span>" : "")
    + (c.prof ? '<span class="b mono">' + esc(c.prof) + "</span>" : "")
    + (c.prop ? '<span class="b">配分 ' + esc(c.prop.join("／")) + "%</span>" : "")
    + (c.boxes !== undefined ? '<span class="b">差分枠 ' + esc(c.boxes) + "</span>" : "")
    + (c.ven ? '<span class="b cal">較正用・KGI対象外</span>' : "")
    + (c.obs || []).map(o => '<span class="b">' + esc(o) + "</span>").join("")
    + (c.masked ? '<span class="b">実験名は社内名のため非表示</span>' : "")
    + "</div>";
  if(c.url) h += '<a class="d-url mono" href="' + esc(c.url) + '" target="_blank" '
    + 'rel="noopener noreferrer">' + esc(c.url) + "</a>";
  if(c.url_b) h += '<a class="d-url mono" href="' + esc(c.url_b) + '" target="_blank" '
    + 'rel="noopener noreferrer">' + esc(c.url_b) + "</a>";

  h += '<div class="judgebar"><div class="judge" role="group" aria-label="判定">'
    + '<button class="ok" data-v="approved" aria-pressed="' + (v === "approved")
    + '">承認<kbd>A</kbd></button>'
    + '<button class="hold" data-v="pending" aria-pressed="' + (v === "pending")
    + '">保留<kbd>H</kbd></button>'
    + '<button class="no" data-v="rejected" aria-pressed="' + (v === "rejected")
    + '">却下<kbd>R</kbd></button></div>'
    + '<div class="notewrap"><input id="note" type="text" value="' + esc(noteOf(c))
    + '" placeholder="判定の理由（台帳にそのまま入る）　N でここへ">'
    + '<span class="saved" id="saved">' + (SAVED[c.id] ? "保存済み" : "") + "</span></div></div>"
    + "</div>";

  h += '<div class="d-body">';
  if((c.nt_items || []).length){
    h += '<div class="facts">' + c.nt_items.map(t =>
      '<span class="fact' + (t.indexOf("注意") === 0 ? " warn" : "") + '">' + esc(t)
      + "</span>").join("") + "</div>";
  }

  const shots = c.shots || [];
  const vps = [...new Set(shots.map(s => s.v).filter(Boolean))];
  if(shots.length){
    if(vps.length > 1){
      h += '<div class="vtabs" role="tablist">' + vps.map((x, i) =>
        '<button class="vtab" role="tab" data-vp="' + x + '" aria-selected="' + (i === 0)
        + '">' + (x === "sp" ? "SP（スマホ）" : "PC（デスクトップ）") + "</button>").join("")
        + "</div>";
    }
    vps.concat(vps.length ? [] : [""]).forEach((x, i) => {
      const set = shots.filter(s => (s.v || "") === x);
      if(!set.length) return;
      h += '<div class="shots' + (set.length === 1 ? " wide" : "") + '" data-vp="' + x + '"'
        + (i === 0 ? "" : ' hidden') + ">" + set.map(shotFig).join("") + "</div>";
    });
  }

  if(c.arms && c.arms.length){
    h += '<div class="sec"><h3>タグに書かれている各アームの中身</h3><div class="arms">'
      + c.arms.map(a => '<div class="arm"><div class="arm-h"><b>' + esc(a.p)
        + "%</b><span>" + esc(a.l || "") + "</span></div><ul>"
        + (a.ln.length ? a.ln.map(x => "<li>" + esc(x) + "</li>").join("")
                       : "<li>（差し込む内容なし＝元のまま）</li>")
        + '</ul><ul class="sel mono">'
        + a.se.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>").join("")
      + "</div></div>";
  }

  if(c.full && (c.full.a || c.full.b)){
    h += '<details class="full"><summary>' + esc(c.full_caption || 'ページ全体を見る（縮小版・文脈確認用）') + '</summary>'
      + '<div class="shots">'
      + (c.full.a ? shotFig(Object.assign({l:"A　control 側"}, c.full.a)) : "")
      + (c.full.b ? shotFig(Object.assign({l:"B　variant 側"}, c.full.b)) : "")
      + "</div></details>";
  }
  if(!shots.length && !(c.arms || []).length){
    h += '<p class="nojudge">画面の比較がありません。'
      + (c.full && c.full.a ? "差分が検出されなかったか、" : "タグの申告だけを拾っており、")
      + "この画面だけでは判定できません（保留のまま次の観測を待つのが安全）。</p>";
  }
  h += '<div class="kdesc"><b>' + esc(K.label) + "</b><br>" + esc(K.desc) + "</div>";
  return h + "</div>";
}
function renderDetail(id, keepScroll){
  const c = IDX[id];
  const pane = el("detail");
  const y = keepScroll ? pane.scrollTop : 0;
  if(!c){
    pane.innerHTML = '<div class="d-empty"><p>左の一覧から候補を選ぶと、'
      + "ここに証拠が出ます。</p><p><kbd>J</kbd> 次　<kbd>K</kbd> 前　<kbd>A</kbd> 承認　"
      + "<kbd>H</kbd> 保留　<kbd>R</kbd> 却下　<kbd>N</kbd> メモ</p></div>";
    return;
  }
  pane.innerHTML = detailHTML(c);
  pane.scrollTop = y;
}
function select(id, scroll){
  CUR = id; writeHash();
  el("list").querySelectorAll(".row").forEach(r =>
    r.setAttribute("aria-current", String(r.dataset.id === id)));
  if(scroll){
    const r = el("list").querySelector('.row[data-id="' + (window.CSS && CSS.escape
      ? CSS.escape(id) : id) + '"]');
    if(r) r.scrollIntoView({block:"nearest"});
  }
  document.body.classList.add("open");
  renderDetail(id);
}
function step(d){
  if(!VIEW.length) return;
  let i = VIEW.findIndex(c => c.id === CUR);
  i = (i < 0) ? (d > 0 ? 0 : VIEW.length - 1) : Math.min(VIEW.length - 1, Math.max(0, i + d));
  select(VIEW[i].id, true);
}

/* ---------- 判定 ---------- */
let toastT = null;
function toast(msg, color){
  const t = el("toast");
  t.innerHTML = (color ? '<span class="dot" style="background:' + color + '"></span>' : "") + esc(msg);
  t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1600);
}
function setVerdict(v){
  if(!CUR) return;
  const c = IDX[CUR];
  const next = (verdictOf(c) === v) ? "" : v;
  // 「次へ」は判定する前の並びで決める（判定で絞り込みから外れても迷子にならない）
  const i = VIEW.findIndex(x => x.id === CUR);
  const nextId = (i >= 0 && i + 1 < VIEW.length) ? VIEW[i + 1].id : null;

  SAVED[c.id] = {id:c.id, verdict:next, note:noteOf(c), at:new Date().toISOString()};
  persist(c.id);
  const row = el("list").querySelector('[data-id="' + (window.CSS && CSS.escape
    ? CSS.escape(c.id) : c.id) + '"]');
  if(row) row.outerHTML = rowHTML(c);
  el("detail").querySelectorAll(".judge button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.v === next)));
  paintStats();
  if(!matches(c)) renderList();          // 判定で絞り込みから外れた行は一覧から消す
  if(!next){ toast("判定を取り消し"); return; }
  const col = next === "approved" ? "var(--ok)" : next === "pending" ? "var(--hold)" : "var(--no)";
  toast(c.co + " を" + VLABEL[next], col);
  if(nextId && IDX[nextId]) setTimeout(() => select(nextId, true), 90);
}

/* ---------- 操作 ---------- */
document.addEventListener("click", e => {
  const row = e.target.closest(".row");
  if(row){ select(row.dataset.id); return; }
  const jb = e.target.closest(".judge button");
  if(jb){ setVerdict(jb.dataset.v); return; }
  const tab = e.target.closest(".vtab");
  if(tab){
    el("detail").querySelectorAll(".vtab").forEach(t =>
      t.setAttribute("aria-selected", String(t === tab)));
    el("detail").querySelectorAll(".shots[data-vp]").forEach(s =>
      s.hidden = (s.dataset.vp !== tab.dataset.vp));
    return;
  }
  const img = e.target.closest("figure img");
  if(img){ const z = el("zoom"); z.querySelector("img").src = img.src; z.classList.add("on"); return; }
  if(e.target.closest("#zoom")){ el("zoom").classList.remove("on"); return; }
  const ch = e.target.closest(".chip[data-set]");
  if(ch){
    const set = S[ch.dataset.set], val = ch.dataset.val;
    set.has(val) ? set.delete(val) : set.add(val);
    writeHash(); renderSide(); renderList(); return;
  }
  if(e.target.closest("#fjud")){ S.jud = !S.jud; writeHash(); renderSide(); renderList(); return; }
  if(e.target.closest("#freset")){
    S.q = ""; el("q").value = "";
    ["kind","tool","vp","st","co"].forEach(k => S[k].clear());
    S.jud = false; writeHash(); renderSide(); renderList(); return;
  }
  if(e.target.closest("#drawer")){ document.body.classList.toggle("drawer"); return; }
  if(e.target.closest("#back")){ document.body.classList.remove("open"); return; }
  if(document.body.classList.contains("drawer") && !e.target.closest(".side")){
    document.body.classList.remove("drawer");
  }
  if(e.target.id === "export"){
    const recs = Object.values(load());
    const blob = new Blob([JSON.stringify(recs, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "reviews_" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(recs.length + " 件を書き出しました");
    return;
  }
  if(e.target.id === "clear"){
    if(!confirm("この端末に貯めた判定を消します。書き出し済みか確認してください。")) return;
    try{ localStorage.removeItem(KEY); }catch(err){}
    location.reload();
  }
});
document.addEventListener("input", e => {
  if(e.target.id === "q"){ S.q = e.target.value.trim(); writeHash(); renderList(); return; }
  if(e.target.id === "cofind"){ window.__cofind = e.target.value.trim(); filterCoList(); return; }
});
document.addEventListener("change", e => {
  if(e.target.id === "sort"){ S.sort = e.target.value; writeHash(); renderList(); return; }
  const cb = e.target.closest('.colist input[data-set]');
  if(cb){
    cb.checked ? S.co.add(cb.dataset.val) : S.co.delete(cb.dataset.val);
    writeHash(); renderList(); return;
  }
  if(e.target.id === "note"){
    const c = IDX[CUR]; if(!c) return;
    SAVED[c.id] = {id:c.id, verdict:verdictOf(c), note:e.target.value, at:new Date().toISOString()};
    persist(c.id); return;
  }
  const f = e.target.closest("#import");
  if(f && f.files && f.files[0]){
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const recs = JSON.parse(rd.result);
        const all = load();
        recs.forEach(r => { if(r && r.id) all[r.id] = r; });
        store(all);
        toast(applyRecords(recs) + " 件を取り込みました");
      }catch(err){ toast("読み込めませんでした（JSONではないようです）"); }
    };
    rd.readAsText(f.files[0]);
  }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if(el("zoom").classList.contains("on")){ el("zoom").classList.remove("on"); return; }
    if(document.activeElement && document.activeElement.tagName === "INPUT"){
      document.activeElement.blur(); return;
    }
    document.body.classList.remove("drawer");
    return;
  }
  const t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if(k === "j" || e.key === "ArrowDown"){ step(1); e.preventDefault(); }
  else if(k === "k" || e.key === "ArrowUp"){ step(-1); e.preventDefault(); }
  else if(k === "a"){ setVerdict("approved"); e.preventDefault(); }
  else if(k === "h"){ setVerdict("pending"); e.preventDefault(); }
  else if(k === "r"){ setVerdict("rejected"); e.preventDefault(); }
  else if(k === "n"){ const n = el("note"); if(n){ n.focus(); n.select(); e.preventDefault(); } }
  else if(k === "/"){ el("q").focus(); e.preventDefault(); }
});
window.addEventListener("hashchange", () => {
  if(hashLock) return;
  readHash(); el("q").value = S.q; el("sort").value = S.sort;
  renderSide(); renderList(); if(CUR) select(CUR, true); else renderDetail(null);
});

/* ---------- 起動 ---------- */
readHash();
el("q").value = S.q; el("sort").value = S.sort;
renderSide(); renderList(); paintStats();
if(CUR) select(CUR, true); else renderDetail(null);

if(typeof claude !== "undefined" && claude.use){
  claude.use("db").then(d => {
    db = d; if(!db) return;
    db.collection("reviews").onSnapshot(snap => {
      applyRecords(snap.docs.map(x => Object.assign({id:x.id}, x.data() || {})));
    }, e => console.error(e));
  }).catch(e => console.error(e));
}
</script>
</body>
